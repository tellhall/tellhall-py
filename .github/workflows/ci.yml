name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  release:
    types: published


jobs:
  #-----------------------------------------------------------------------------
  # The package and its tests use only the standard library, so tests need no
  # dependencies installed.
  test:
    name: Test / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'windows-2022', 'macos-15']
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - run: python -m pip install .

    - run: python -m unittest discover -s tests -t . -v

    - run: python -m tellhall name "Project Nightjar"

  #-----------------------------------------------------------------------------
  checks:
    name: ${{ matrix.checks.name }} / ubuntu-22.04 / Python 3.14
    strategy:
      fail-fast: false
      matrix:
        checks:
          - {name: 'Quality', command: 'ruff check && ruff format --check && mypy --strict'}
          - {name: 'Package', command: 'python -m build'}

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: checks-pip-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}
        restore-keys: checks-pip-

    - run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - run: ${{ matrix.checks.command }}

    - uses: actions/upload-artifact@v4
      if: matrix.checks.name == 'Package'
      with:
        name: dist
        path: dist

  #-----------------------------------------------------------------------------
  upload:
    name: Publish
    if: github.event_name == 'release'

    needs: [test, checks]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip_existing: true
